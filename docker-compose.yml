services:
  web:
    build: .
    container_name: lifekeeper-web
    restart: always
    ports:
      - "80:80"
    depends_on:
      - api
      - postgres
      - tts

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: lifekeeper-api
    restart: always
    ports:
      - "127.0.0.1:4000:4000"
    environment:
      PORT: 4000
      DATABASE_URL: postgres://lifekeeper_admin:lifekeeper_secure_password_2026@postgres:5432/lifekeeper_vault
      JWT_SECRET: ${JWT_SECRET:-lifekeeper_super_secure_jwt_secret_2026_xyz}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-LifeKeeper <no-reply@lifekeeper.lat>}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: lifekeeper-postgres
    restart: always
    environment:
      POSTGRES_DB: lifekeeper_vault
      POSTGRES_USER: lifekeeper_admin
      POSTGRES_PASSWORD: lifekeeper_secure_password_2026
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lifekeeper_admin -d lifekeeper_vault"]
      interval: 5s
      timeout: 5s
      retries: 5

  tts:
    build: ./tts
    container_name: lifekeeper-tts
    restart: always
    # Sin puertos publicados: solo accesible desde nginx dentro de la red de Docker

  ollama:
    image: ollama/ollama:latest
    container_name: lifekeeper-ollama
    restart: always
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  pgdata:
  ollama_data:
